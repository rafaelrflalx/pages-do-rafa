<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 880 155" width="880" height="155">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&amp;display=swap');
    </style>
  </defs>

  <!-- Monograma: W | linha | A -->
  <text x="68" y="160"
        font-family="'Cinzel', 'Trajan Pro', serif"
        font-weight="600"
        font-size="150"
        fill="#000000"
        text-anchor="middle">W</text>

  <line x1="130" y1="26" x2="130" y2="164"
        stroke="#000000" stroke-width="1.2"/>

  <text x="192" y="160"
        font-family="'Cinzel', 'Trajan Pro', serif"
        font-weight="600"
        font-size="150"
        fill="#000000"
        text-anchor="middle">A</text>

  <!-- Divisor vertical entre monograma e texto -->
  <line x1="272" y1="36" x2="272" y2="162"
        stroke="#000000" stroke-width="1"/>

  <!-- Nome do escritório -->
  <text x="306" y="106"
        font-family="'Cinzel', 'Trajan Pro', serif"
        font-weight="500"
        font-size="30"
        fill="#000000"
        text-anchor="start"
        letter-spacing="6"
        dominant-baseline="middle">ADVOCACIA IMOBILIÁRIA</text>
</svg>
